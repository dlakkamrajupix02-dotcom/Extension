name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  client-sdk-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install client SDK dependencies
        run: |
          cd client-sdk
          npm ci || npm install

      - name: Typecheck TypeScript SDK
        run: |
          cd client-sdk
          npm run typecheck

      - name: Run Vitest Unit Tests
        run: |
          cd client-sdk
          npm test

      - name: Build TypeScript Production Bundle
        run: |
          cd client-sdk
          npm run build
