[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "payload-shield"
version = "0.1.0"
description = "FastAPI payload encryption library to deter casual scraping and automated bots."
readme = "README.md"
authors = [{ name = "Payload Shield Contributors" }]
license = "MIT"
requires-python = ">=3.9"

dependencies = [
    "fastapi>=0.100.0",
    "cryptography>=41.0.0",
    "redis>=5.0.0",
    "pydantic>=2.0.0"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security :: Cryptography"
]

[project.urls]
Homepage = "https://github.com/payload-shield/payload-shield"
Documentation = "https://github.com/payload-shield/payload-shield#readme"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

